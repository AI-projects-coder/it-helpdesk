# CI: lint + tests (scripted fake LLM, no API key, no cost) and a Docker build check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: it-helpdesk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image boots and finds its config
        run: |
          docker run --rm --entrypoint helpdesk it-helpdesk:ci list-tools
          docker run --rm --entrypoint helpdesk it-helpdesk:ci list-agents
          docker run --rm --entrypoint python it-helpdesk:ci -c "import helpdesk.ui.dashboard"

      - name: Image has no secrets and runs as non-root
        run: |
          test "$(docker run --rm --entrypoint whoami it-helpdesk:ci)" = helpdesk
          docker run --rm --entrypoint sh it-helpdesk:ci -c 'test ! -e /app/.env'
