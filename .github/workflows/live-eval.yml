# Live evaluation against the real LLM: smoke scenarios + 50-ticket eval vs the committed baseline.
# Costs a few cents per run, so it is manual (Actions tab -> Live eval -> Run workflow).
# Requires repository secret OPENAI_API_KEY (Settings -> Secrets and variables -> Actions).
name: Live eval

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Tickets to evaluate (blank = all 50)"
        required: false
        default: ""
  # Uncomment for a nightly run (~$0.05 each):
  # schedule:
  #   - cron: "0 3 * * *"

concurrency:
  group: live-eval
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    name: Smoke + eval vs baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Require API key secret
        if: env.OPENAI_API_KEY == ''
        run: |
          echo "::error::Set the OPENAI_API_KEY repository secret to run the live eval."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Build KB index
        run: python scripts/prepare_data.py --index-only

      - name: Smoke scenarios
        run: python scripts/smoke_test.py

      - name: Eval vs baseline (fails on regression)
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          helpdesk eval --concurrency 4 ${LIMIT:+--limit "$LIMIT"}

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: data/eval/latest.json
          if-no-files-found: ignore
